name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable && corepack prepare yarn@3.6.4 --activate

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test --watchAll=false
        env:
          CI: true

      - name: Run the ingestion tests
        run: yarn workspace @total-guess/ingestion test

      - name: Build
        run: yarn build
        env:
          CI: false
